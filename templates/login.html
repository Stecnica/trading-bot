<!DOCTYPE html>
<html lang="it">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Accesso — Trading bot</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
	<link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
</head>
<body class="bg-light">
<main class="container py-5">
	<div class="row justify-content-center">
	<div class="col-11 col-sm-8 col-md-6 col-lg-4">
	<div class="card shadow-sm">
		<div class="card-body p-4">
			<h1 class="h4 mb-1">Accesso</h1>
			<p class="text-secondary">Trading bot</p>
			{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
			<form method="post" action="{{ url_for('login') }}">
				<input type="hidden" name="csrf" value="{{ csrf }}">
				<input type="hidden" name="next" value="{{ next }}">
				<div class="mb-3">
					<label class="form-label" for="username">Utente</label>
					<input class="form-control" id="username" name="username" autocomplete="username" required>
				</div>
				<div class="mb-3">
					<label class="form-label" for="password">Password</label>
					<input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
				</div>
				<button class="btn btn-primary" type="submit">Entra</button>
			</form>
		</div>
	</div>
	</div>
	</div>
</main>
</body>
</html>
