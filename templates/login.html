<!DOCTYPE html>
<html lang="it">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Accesso — Trading bot</title>
	<style>
		:root { color-scheme: light; }
		* { box-sizing: border-box; }
		body { margin: 0; font: 16px/1.45 system-ui, sans-serif; color: #1c1c1c; background: #f4f6f8; }
		main { max-width: 26rem; margin: 8vh auto; padding: 1.25rem; }
		h1 { font-size: 1.5rem; margin: 0 0 0.4rem; }
		.card { background: #fff; border: 1px solid #e1e4e8; border-radius: 10px; padding: 1.1rem; }
		label { display: flex; flex-direction: column; gap: 0.25rem; margin: 0.7rem 0; font-size: 0.9rem; }
		input, button { font: inherit; padding: 0.45rem 0.55rem; }
		button { background: #1565c0; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
		.err { background: #ffebee; padding: 0.6rem 0.75rem; border-radius: 8px; }
		p { color: #444; margin: 0.3rem 0 0.6rem; }
	</style>
</head>
<body>
<main>
	<div class="card">
		<h1>Accesso</h1>
		<p>Trading bot</p>
		{% if error %}<p class="err">{{ error }}</p>{% endif %}
		<form method="post" action="{{ url_for('login') }}">
			<input type="hidden" name="csrf" value="{{ csrf }}">
			<input type="hidden" name="next" value="{{ next }}">
			<label>Utente <input name="username" autocomplete="username" required></label>
			<label>Password <input name="password" type="password" autocomplete="current-password" required></label>
			<button type="submit">Entra</button>
		</form>
	</div>
</main>
</body>
</html>
